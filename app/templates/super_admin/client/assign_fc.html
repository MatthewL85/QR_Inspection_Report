{% extends 'layouts/super_admin_base.html' %}

{% block page_content %}
<section class="content-panel">
  <div class="panel-header d-flex justify-content-between align-items-center">
    <div>
      <h2>Assign Financial Controller</h2>
      <p class="text-muted mb-0">{{ client.name }}</p>
    </div>
    <a href="{{ url_for('super_admin.view_client', client_id=client.id) }}" class="btn btn-outline-secondary">Back to Client</a>
  </div>

  <form method="POST" class="form-grid mt-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-field">
      <label for="financial_controller_id">Financial Controller</label>
      <select id="financial_controller_id" name="financial_controller_id" class="form-select" required>
        <option value="">Select financial controller</option>
        {% for fc in financial_controllers %}
          <option value="{{ fc.id }}" {% if client.financial_controller_id == fc.id %}selected{% endif %}>{{ fc.full_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Assignment</button>
    </div>
  </form>
</section>
{% endblock %}
