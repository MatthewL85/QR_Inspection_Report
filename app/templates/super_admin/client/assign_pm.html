{% extends 'layouts/super_admin_base.html' %}

{% block page_content %}
<section class="content-panel">
  <div class="panel-header d-flex justify-content-between align-items-center">
    <div>
      <h2>Assign Property Manager</h2>
      <p class="text-muted mb-0">{{ client.name }}</p>
    </div>
    <a href="{{ url_for('super_admin.view_client', client_id=client.id) }}" class="btn btn-outline-secondary">Back to Client</a>
  </div>

  <form method="POST" class="form-grid mt-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-field">
      <label for="property_manager_id">Property Manager</label>
      <select id="property_manager_id" name="property_manager_id" class="form-select" required>
        <option value="">Select property manager</option>
        {% for pm in pms %}
          <option value="{{ pm.id }}" {% if client.property_manager_id == pm.id %}selected{% endif %}>{{ pm.full_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Assignment</button>
    </div>
  </form>
</section>
{% endblock %}
