{% extends 'base.html' %}

{% block title %}Verify Email{% endblock %}

{% block page_content %}
<section class="container py-4">
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-start gap-3">
        <div>
          <h4 class="mb-1">Email Verification</h4>
          <p class="text-muted mb-0">Send a fresh verification link to your registered email address.</p>
        </div>
        <a href="{{ url_for('auth.profile') }}" class="btn btn-outline-secondary">Back to Profile</a>
      </div>

      <form method="POST" class="mt-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-primary">Resend Verification Link</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
